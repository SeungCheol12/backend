spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini

  application:
    name: ai

  # DB 서버 연동 정보
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/movie
    username: javadb
    password: 12345

    # 오라클
    # driver-class-name: oracle.jdbc.OracleDriver
    # url: jdbc:oracle:thin:@localhost:1521:xe
    # username: javadb
    # password: 12345

  # JPA 설정
  jpa:
    # 테이블 자동 생성 여부
    # none : 운영환경
    # validate : 엔티티와 테이블 정상 매핑 확인(운영환경)
    # create : 기존 테이블 삭제 후 테이블 생성(개발시)
    # create-drop : 기존 테이블 삭제 후 테이블 생성, 종료 시점에 테이블 삭제
    # update : 변경된 부분만 적용(기존 칼럼 제거는 안해줌)
    hibernate:
      ddl-auto: update

    # 생성되는 sql 구문 출력 여부
    # show-sql: true

    # 예쁘게 sql 구문 출력
    properties:
      hibernate:
        "[format_sql]": true
        "[highlight_sql]": true

  # OAuth 프로파일 포함
  profiles:
    include: oauth

  # 파일 업로드 설정
  servlet:
    multipart:
      # 파일 업로드 가능 여부
      enabled: true
      # 업로드 된 파일의 임시 저장 경로
      location: c:\\upload
      # 파일 하나의 최대 크기
      max-file-size: 10MB
      # 한 번에 최대 업로드 가능 용량
      max-request-size: 30MB

# 로그 출력 (개발용)
logging:
  level:
    "[com.example.movietalk]": DEBUG # 전체 애플리케이션 로그
    org:
      hibernate:
        SQL: debug
        orm:
          jdbc:
            bind: trace

# 실제 파일이 업로드 될 경로 (클래스파일에서 호출)
com:
  example:
    movietalk:
      upload:
        path: c:\\upload
        # 프로젝트 내에 폴더 생성됨
        # path: upload
